name: build-apk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permissoes de execucao
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: imvu-radar-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: imvu-radar-release
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 90

      - name: Ler versionCode do app
        id: ver
        run: echo "code=$(grep -oE 'versionCode = [0-9]+' app/build.gradle.kts | grep -oE '[0-9]+' | head -1)" >> $GITHUB_OUTPUT

      - name: Publish release (tag only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/app-release.apk
          name: IMVURadar-${{ steps.ver.outputs.code }}.apk
          body: |
            Atualização automática do IMVU Radar.
            O app verifica esta release e instala a versão nova.

      - name: Renomear asset (o app le a versao do nome do arquivo)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ASSET_ID=$(gh api repos/${{ github.repository }}/releases/tags/${{ github.ref_name }} --jq '.assets[0].id')
          gh api --method PATCH repos/${{ github.repository }}/releases/assets/$ASSET_ID \
            -f name=IMVURadar-${{ steps.ver.outputs.code }}.apk > /dev/null
          echo "asset renomeado para IMVURadar-${{ steps.ver.outputs.code }}.apk"
