<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no" />
<meta name="theme-color" content="#05070c" />
<title>IMVU Radar</title>
<style>
:root{--bg:#05070c;--panel:rgba(14,19,32,.88);--panel2:rgba(22,29,47,.6);--line:rgba(130,170,255,.14);
--line2:rgba(130,170,255,.3);--txt:#e9eefb;--mut:#8b9cc2;--acc:#7c5cff;--acc2:#21d4fd;--ok:#2ee6a8;--warn:#ffc857;--bad:#ff5f7e;--priv:#ffb347}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{overscroll-behavior:none}
.bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:center;filter:saturate(1.1) blur(3px);opacity:.35}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,7,12,.86),rgba(5,7,12,.97))}
.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;background:linear-gradient(180deg,rgba(6,9,16,.95),rgba(6,9,16,.55));backdrop-filter:blur(12px)}
.brand{font-weight:800;letter-spacing:.4px;font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 12px var(--ok);display:inline-block}
.dot.off{background:var(--bad);box-shadow:0 0 12px var(--bad)}
.dot.wait{background:var(--warn);box-shadow:0 0 12px var(--warn)}
.top .sp{flex:1}
.iconbtn{background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--txt);width:38px;height:38px;border-radius:11px;font-size:16px}
main{position:relative;z-index:1;padding:74px 14px calc(env(safe-area-inset-bottom) + 78px)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;backdrop-filter:blur(10px)}
h1{font-size:21px;margin:0 0 4px}
h2{font-size:12.5px;letter-spacing:.7px;text-transform:uppercase;color:#d6e0ff;margin:18px 0 10px}
.sub{color:var(--mut);font-size:13px;margin:0 0 14px}
input,select{width:100%;background:#070b14;border:1px solid var(--line2);border-radius:12px;color:var(--txt);
padding:13px 14px;font-size:15px;outline:none;margin-bottom:10px}
input:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(124,92,255,.18)}
button{width:100%;background:linear-gradient(135deg,var(--acc),#3f7dff);border:0;border-radius:12px;color:#fff;
padding:14px;font-weight:700;font-size:15px;cursor:pointer}
button:active{transform:scale(.98)}
button.ghost{background:transparent;border:1px solid var(--line2);color:var(--mut)}
.row2{display:flex;gap:9px;flex-wrap:wrap}.row2>*{flex:1 1 45%;min-width:0;width:auto;white-space:normal;font-size:13.5px;padding:13px 6px}
.tag{display:inline-flex;align-items:center;padding:3px 9px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.5px;border:1px solid var(--line2)}
.tag.on{color:var(--ok);border-color:rgba(46,230,168,.45);background:rgba(46,230,168,.1)}
.tag.off{color:var(--bad);border-color:rgba(255,95,126,.4);background:rgba(255,95,126,.08)}
.tag.priv{color:var(--priv);border-color:rgba(255,179,71,.45);background:rgba(255,179,71,.1)}
.tag.pub{color:var(--mut)}
.empty{color:var(--mut);font-size:13px;padding:12px 2px}
.bar{height:4px;border-radius:99px;background:rgba(130,170,255,.14);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;width:30%;background:linear-gradient(90deg,var(--acc),var(--acc2));animation:sl 1.1s infinite linear}
@keyframes sl{0%{margin-left:-30%}100%{margin-left:100%}}
.mono{font-family:ui-monospace,Menlo,monospace}
.muted{color:var(--mut)}
.hero{display:flex;gap:14px;align-items:center}
.hero .picwrap{position:relative;flex:0 0 auto;width:110px;height:150px;display:flex;align-items:flex-end;justify-content:center}
.hero img.pic{width:104px;height:146px;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.8))}
.hero img.photo{position:absolute;right:-6px;bottom:2px;width:54px;height:66px;object-fit:cover;
  border-radius:10px;border:2px solid rgba(255,255,255,.16);box-shadow:0 8px 18px rgba(0,0,0,.7)}
.nm{font-size:19px;font-weight:800}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px}
.ptile{border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--panel2);text-align:center}
.ptile img{width:100%;height:112px;object-fit:cover;display:block}
.ptile .n{font-size:10.5px;font-weight:700;padding:5px 4px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptile .c{font-size:9.5px;color:var(--mut);font-family:ui-monospace,monospace;padding-bottom:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.roomcover{position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--line);margin-bottom:12px}
.roomcover img{width:100%;height:170px;object-fit:cover;display:block}
.roomcover .ov{position:absolute;inset:auto 0 0 0;padding:9px 11px;background:linear-gradient(0deg,rgba(6,9,16,.96),transparent)}
.rm{font-weight:800;font-size:16px}
.list{max-height:52vh;overflow-y:auto}
.line{display:flex;gap:9px;align-items:center;padding:8px;border-left:2px solid var(--line2);margin-bottom:7px;background:var(--panel2);border-radius:0 11px 11px 0}
.line .i{flex:1;min-width:0}
.line .n{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.line .t{font-size:9.5px;color:var(--mut);font-family:ui-monospace,monospace}
.line .a{font-size:9px;font-weight:800;padding:3px 7px;border-radius:6px}
.a.in{color:var(--ok);background:rgba(46,230,168,.13)}.a.out{color:var(--bad);background:rgba(255,95,126,.13)}
.trackline{font-family:ui-monospace,monospace;font-size:12.5px;line-height:1.6;word-break:break-word}
nav.bot{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:rgba(8,11,19,.96);
backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.bot button{flex:1 1 0;min-width:0;background:transparent;color:var(--mut);font-size:10px;padding:9px 1px;border-radius:0;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.bot button b{font-size:16px;font-weight:400;line-height:1}
nav.bot button.on{color:var(--txt)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(3,5,10,.9);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.sheet{background:linear-gradient(180deg,#131b2e,#090d17);border:1px solid var(--line2);border-radius:18px;padding:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto}
.sheet img{width:100%;border-radius:12px;margin-top:10px;background:#060a11}
@media (min-width:900px){
  main{max-width:980px;margin:0 auto;padding-left:24px;padding-right:24px;padding-bottom:92px}
  nav.bot{left:50%;right:auto;transform:translateX(-50%);width:min(680px,calc(100% - 24px));border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}
  .people{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
</style>
</head>
<body>
<!-- site: https://imvu-radar.vercel.app - atualizacoes daqui vao para o WebView do APK -->
<div class="bg" id="bg"></div>
<div class="top">
  <span class="dot" id="dot"></span>
  <span class="brand">IMVU Radar</span>
  <span class="sp"></span>
  <button class="iconbtn" onclick="go('ajustes')">⚙</button>
</div>
<main id="app"></main>
<nav class="bot" id="nav"></nav>

<div id="toast" style="position:fixed;left:14px;right:14px;bottom:78px;z-index:60;background:rgba(10,15,26,.96);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;font-size:12.5px;opacity:0;transition:opacity .2s;pointer-events:none"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const imgCache={};
function imgAuth(url,id){
  if(!url) return '';
  if(imgCache[id]) return imgCache[id];
  if(window.Radar && Radar.fetchImage){ try{ Radar.fetchImage(url,id); }catch(_){} }
  return imgCache[id]||'';
}
window.__radarImage=function(id,data){
  imgCache[id]=data;
  document.querySelectorAll('img[data-imgid="'+id+'"]').forEach(function(el){ if(data) el.src=data; });
};
const TABS=[['onde','🔎','Onde'],['privada','🔒','Privada'],['ajustes','⚙','Ajustes']];
let TAB=(location.hash||'').replace('#','');
if(!TABS.some(t=>t[0]===TAB)) TAB='onde';

function renderNav(){
  $('#nav').innerHTML=TABS.map(([id,ic,lb])=>`<button class="${TAB===id?'on':''}" onclick="go('${id}')"><b>${ic}</b><span>${lb}</span></button>`).join('');
}
function go(id){ TAB=id; try{ location.hash=id; }catch(_){} render(); }
function setBg(u){ $('#bg').style.backgroundImage = u? `url('${u}')`:''; }
function out(id){ return document.getElementById(id||'out'); }
function load(msg,id){ const o=out(id); if(o) o.innerHTML='<div class="bar"><i></i></div><div class="muted">'+esc(msg)+'</div>'; }

const V={
  onde:()=>`<div class="card"><h1>Onde está</h1><p class="sub">localiza o nick nas salas públicas/listadas do IMVU</p>
    <input id="nick" placeholder="nick / avatar" autocapitalize="off" autocorrect="off">
    <button onclick="act('where')">Rastrear</button><div id="out"></div></div>`,
  privada:()=>`<div class="card" style="border-color:rgba(255,179,71,.35)"><h1 style="color:#ffcf87">Rastreio em tempo real</h1>
    <p class="sub">IMQ: sala privada atual e ocupantes</p>
    <input id="trackNick" placeholder="nick / avatar" autocapitalize="off" autocorrect="off">
    <div class="row2"><button onclick="act('track')">Iniciar</button><button class="ghost" onclick="act('stop')">Parar</button></div>
    <div class="hero" id="trackHero" style="display:none;margin-top:12px">
      <div class="picwrap" style="width:70px;height:92px"><img id="trackAvatar" class="pic" style="width:66px;height:88px" src="" alt=""></div>
      <div><div class="nm" id="trackTargetName"></div><div class="muted mono" id="trackTargetCid" style="font-size:11.5px"></div></div>
    </div>
    <div id="trackStatus" class="muted mono" style="font-size:12px;margin-top:10px"></div>
    <div class="card" id="privCard" style="margin-top:10px;border-color:rgba(255,179,71,.35)">
      <div class="tag priv">SALA PRIVADA</div>
      <div id="privRoom" style="margin-top:8px"></div>
      <div id="privOcc" class="trackline" style="margin-top:8px"></div>
    </div>
    <h2>Movimento da sala</h2>
    <div id="trackLog" class="list"></div>
  </div>`,
  ajustes:()=>`<div class="card"><h1>Ajustes</h1><p class="sub">conexão e atualização</p>
    <button class="ghost" onclick="act('status')">Ver status</button>
    <div class="row2" style="margin-top:9px"><button onclick="act('update')">Verificar atualização</button></div>
    <div id="out3"></div></div>`
};

function render(){
  renderNav();
  $('#app').innerHTML = V[TAB]();
  if(TAB==='onde'){ const n=$('#nick'); if(n) n.value=lastNick||''; }
  if(TAB==='privada'){ const n=$('#trackNick'); if(n) n.value=trackNick||''; }
  if(!window.Radar && (TAB==='onde' || TAB==='privada')) loadRemoteStatus();
}

let lastNick='';
let trackNick='';
let lastTrackTarget=null;
let lastPrivacy='';
let lastRemoteAt=0;
let lastRemoteImq=false;

async function act(a){
  if(a==='where'){
    lastNick=($('#nick').value||'').trim();
    if(!lastNick){ load('digite o nick'); return; }
    if(window.Radar){
      load('rastreando…');
      try{ Radar.where(lastNick); }catch(e){ load('bridge indisponivel'); }
    } else {
      load('buscando no APK…');
      try{ await api('/api/command',{method:'POST',body:JSON.stringify({action:'where',nick:lastNick})}); toast('busca enviada ao APK'); }catch(e){ load('site/APK offline'); }
    }
  }
  else if(a==='track'){
    trackNick=($('#trackNick').value||'').trim();
    if(!trackNick){ const st=$('#trackStatus'); if(st) st.textContent='digite o nick'; return; }
    clearTrackUI();
    const st=$('#trackStatus'); if(st) st.textContent='iniciando rastreio…';
    if(window.Radar){
      try{ Radar.track(trackNick); }catch(e){ if(st) st.textContent='bridge indisponivel'; }
    } else {
      try{ await api('/api/command',{method:'POST',body:JSON.stringify({action:'track',nick:trackNick})}); toast('comando enviado ao APK'); }catch(e){ toast('erro: '+e.message); }
    }
  }
  else if(a==='stop'){
    if(window.Radar){ try{ Radar.stopTrack(); }catch(_){} }
    else { try{ await api('/api/command',{method:'POST',body:JSON.stringify({action:'stop',nick:''})}); toast('parar enviado ao APK'); }catch(e){} }
    const st=$('#trackStatus'); if(st) st.textContent='rastreio parado';
    clearTrackUI();
  }
  else if(a==='status'){
    if(window.Radar){
      try{
        const s=JSON.parse(Radar.status());
        const o=out('out3');
        if(o) o.innerHTML='<div class="mono" style="font-size:12.5px;line-height:1.7">conectado: '+(s.loggedIn?'sim':'nao')+
          '<br>canal IMQ: '+(s.imq?'ativo':'reconectando')+
          '<br>alvo: '+esc(s.targetNick||'-')+
          '<br>sala: '+esc(s.room||'-')+' '+esc(s.roomName||'')+
          '<br>ocupantes: '+(s.occupants||0)+'</div>';
      }catch(e){ load('erro no status','out3'); }
    } else {
      try{
        const s=await api('/api/status');
        const o=out('out3');
        if(o) o.innerHTML='<div class="mono" style="font-size:12.5px;line-height:1.7">APK: '+(s.imq?'online':'offline')+
          '<br>sala: '+esc(s.room||'-')+' '+esc(s.roomName||'')+
          '<br>tipo: '+esc(s.privacy||'-')+
          '<br>ocupantes: '+(s.occupants||0)+'</div>';
      }catch(e){ load('site/APK offline','out3'); }
    }
  }
  else if(a==='update'){
    if(window.Radar){
      load('consultando…','out3');
      try{ Radar.checkUpdate(); }catch(e){ load('bridge indisponivel','out3'); }
    } else {
      load('consultando…','out3');
      try{
        const v=await fetch('/api/version').then(r=>r.json());
        const o=out('out3');
        if(o) o.innerHTML=v.ok?'<div class="muted" style="font-size:13px">APK latest: '+esc(v.tag)+'</div>':'<div class="muted" style="font-size:13px">versao indisponivel</div>';
      }catch(e){ load('erro ao consultar','out3'); }
    }
  }
}

function tagRoom(p){
  const s=String(p||'').toLowerCase();
  return (s.includes('priv'))?'<span class="tag priv">PRIVADA</span>':'<span class="tag pub">PUBLICA</span>';
}
function peopleGrid(list,empty){
  if(!list||!list.length) return '<div class="empty">'+(empty||'ninguem visivel')+'</div>';
  return '<div class="people">'+list.map(p=>`<div class="ptile" onclick="ficha('${esc(p.cid)}','${esc(p.username)}','${esc(p.display_name)}','${esc(p.render||'')}','${esc(p.avatar||'')}')">
   <img loading="lazy" src="${esc(p.avatar||p.render||'')}"/><div class="n">${esc(p.display_name||p.username)}</div><div class="c">${esc(p.username)}</div></div>`).join('')+'</div>';
}
function ficha(cid,user,name,render,photo){
  const id='fic_'+cid;
  $('#sheet').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center"><h3 style="margin:0">'+esc(name||user)+'</h3><button class="iconbtn" onclick="document.getElementById(\'modal\').classList.remove(\'on\')">✕</button></div>'+
   '<div class="muted mono" style="font-size:12px">'+esc(user)+' · cid '+esc(cid)+'</div>'+
   '<img src="'+esc(photo||'')+'"><div class="muted" style="font-size:11px;margin-top:6px">foto no jogo</div>'+
   '<img data-imgid="'+id+'" src="'+esc(photo||'')+'"><div class="muted" style="font-size:11px;margin-top:6px">avatar 3D</div>';
  if(render){ try{ Radar.fetchImage(render,id); }catch(_){} }
  $('#modal').classList.add('on');
}

function nowTime(){ try{ return new Date().toLocaleTimeString('pt-BR'); }catch(_){ return ''; } }

function viaName(v){
  const m={roster:'lista/roster',imq:'IMQ',imq_new:'IMQ (entrou agora)',imq_probe:'IMQ (fila ativa)',myroom:'My Room (provável)',catvu:'catvu',friends:'lista de amigos (IMVU)',local:'log local',self_recent:'recent_rooms'};
  return m[v]||v||'';
}

function clearTrackUI(){
  const pr=$('#privRoom'); if(pr) pr.innerHTML='';
  const po=$('#privOcc'); if(po) po.innerHTML='';
  const l=$('#trackLog'); if(l) l.innerHTML='';
  const hero=$('#trackHero'); if(hero) hero.style.display='none';
  const av=$('#trackAvatar'); if(av) av.src='';
  lastTrackTarget=null;
  lastPrivacy='';
}

function logTrack(html,cls){
  const o=$('#trackLog');
  if(!o) return;
  const row=document.createElement('div');
  row.className='line';
  row.innerHTML='<div class="i"><div class="n trackline">'+html+'</div><div class="t">'+nowTime()+'</div></div>'+(cls?'<span class="a '+cls+'">'+(cls==='in'?'ENTROU':'SAIU')+'</span>':'');
  o.prepend(row);
  while(o.querySelectorAll('.line').length>80) o.querySelectorAll('.line')[o.querySelectorAll('.line').length-1].remove();
}

function setOccupants(list,total){
  if(lastPrivacy!=='PRIVADA') return;
  const nomes=(list||[]).map(o=>o.nick||o.username||o.cid).filter(Boolean);
  const t=(total!=null)?total:nomes.length;
  const o=$('#privOcc');
  if(o) o.innerHTML='<span class="muted">['+nowTime()+']</span> OCUPANTES ATUAIS: '+(nomes.length?esc(nomes.join(', ')):'(ninguem)')+' (Total: '+t+')';
}

function toast(msg){
  const el=document.getElementById('toast');
  if(!el) return;
  el.textContent=msg||'';
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(function(){ el.style.opacity='0'; }, 4500);
}

function showUpdate(d){
  if(!d || !d.update) return;
  $('#sheet').innerHTML='<h3 style="margin:0 0 6px">Atualização disponível</h3>'+
    '<p class="sub">versão '+esc(d.versionCode)+'</p>'+
    '<div id="updStatus" class="muted" style="font-size:12px;margin-bottom:10px"></div>'+
    '<button onclick="Radar.installUpdate(\''+esc(d.url)+'\')">Baixar e instalar</button>';
  $('#modal').classList.add('on');
}

window.__radarEvent = function(e){
  const t=e.type;
  if(t==='ready' || t==='imq_ready'){ $('#dot').className='dot'; }
  else if(t==='login_error'){ $('#dot').className='dot wait'; showLogin(e.message); }
  else if(t==='imq_error'){ $('#dot').className='dot wait'; }
  else if(t==='log'){
    const msg=e.msg||'';
    toast(msg);
    const us=document.getElementById('updStatus'); if(us) us.textContent=msg;
  }
  else if(t==='where'){
    const d=e.data||{}, p=d.profile||{}, rooms=d.rooms||[];
    const list=(rooms&&rooms.length)?rooms:((d.room&&d.room.roomId)?[d.room]:[]);
    if(list.length&&list[0].render) setBg(list[0].render);
    if(p.render){ try{ Radar.fetchImage(p.render,'av_'+p.cid); }catch(_){} }
    const o=out();
    if(!o) return;
    const badge=p.online?'<span class="tag on">ONLINE</span>':((p.is_vip||p.is_ap)?'<span class="tag off">PRESENÇA OCULTA</span>':'<span class="tag off">NÃO VISTO</span>');
    let h='<div class="hero" style="margin-top:16px"><div class="picwrap">'+
      '<img class="pic" data-imgid="av_'+esc(p.cid)+'" src="'+esc(p.avatar||'')+'" alt="">'+
      (p.avatar?'<img class="photo" src="'+esc(p.avatar)+'" alt="">':'')+
      '</div><div style="min-width:0"><div class="nm">'+esc(p.display_name||p.username)+'</div>'+
      '<div class="muted mono" style="font-size:12px">'+esc(p.username)+' · cid '+esc(p.cid)+'</div>'+
      '<div class="badges">'+badge+(p.is_vip?'<span class="tag vip">VIP</span>':'')+(p.is_ap?'<span class="tag vip">AP</span>':'')+'</div>';
    if(list.length) h+='<div class="rm">em '+list.length+' sala'+(list.length>1?'s':'')+'</div>';
    h+='</div></div>';
    if(list.length){
      h+='<h2 style="margin-top:16px">Salas</h2>';
      list.forEach(function(r){
        h+='<div class="card" style="margin-bottom:12px">';
        if(r.render) h+='<div class="roomcover"><img src="'+esc(r.render)+'"><div class="ov"><div class="rm">'+esc(r.name||r.roomId)+'</div>'+
          '<div class="muted mono" style="font-size:11.5px">['+esc(r.roomId)+'] · '+(r.occupancy||'?')+'/'+(r.capacity||'?')+'</div></div></div>';
        else h+='<div class="rm">'+esc(r.name||r.roomId)+' <span class="muted mono">['+esc(r.roomId)+']</span></div>';
        h+='<div class="badges" style="margin:8px 0">'+tagRoom(r.privacy)+(r.owner?'<span class="muted">dono: '+esc(r.owner)+'</span>':'')+'</div>';
        h+=peopleGrid(r.peopleList||[],'ninguem visivel');
        h+='</div>';
      });
    } else {
      h+='<div class="card" style="margin-top:12px;background:rgba(255,95,126,.07);border-color:rgba(255,95,126,.3)"><b style="color:#ff8fa3">'+
        (p.is_vip||p.is_ap?'Presença oculta (VIP/AP)':'Não achei nas listas públicas')+'</b>'+
        '<p class="sub" style="margin:8px 0 10px">Use a aba <b>Privada</b> para o rastreio via IMQ (sala atual + roster).</p></div>';
    }
    o.innerHTML=h;
  }
  else if(t==='track_start'){
    clearTrackUI();
    lastTrackTarget=e.target||null;
    const n=(lastTrackTarget&&(lastTrackTarget.username||lastTrackTarget.display_name))||trackNick;
    const st=$('#trackStatus'); if(st) st.textContent='rastreando '+n+'…';
    const hero=$('#trackHero'); if(hero) hero.style.display='flex';
    const av=$('#trackAvatar'); if(av) av.src=(lastTrackTarget&&(lastTrackTarget.avatar||''))||'';
    const tn=$('#trackTargetName'); if(tn) tn.textContent=(lastTrackTarget&&(lastTrackTarget.display_name||lastTrackTarget.username))||n;
    const tc=$('#trackTargetCid'); if(tc) tc.textContent=lastTrackTarget?('@'+lastTrackTarget.username+' · cid '+lastTrackTarget.cid):'';
  }
  else if(t==='track_status'){
    const st=$('#trackStatus'); if(st) st.textContent=e.msg||'';
  }
  else if(t==='track_room'){
    const tg=e.target||lastTrackTarget||{};
    const nick=tg.username||tg.display_name||trackNick||'alvo';
    const name=e.name||e.room||'';
    const priv=e.privacy||'?';
    lastPrivacy=priv;
    const via=e.detectedBy?(' · fonte: '+esc(viaName(e.detectedBy))):'';
    const r=$('#privRoom');
    const o=$('#privOcc');
    if(priv==='PRIVADA'){
      if(r) r.innerHTML='<div class="trackline"><span class="muted">['+nowTime()+']</span> ALVO AQUI: '+esc(nick)+' está na sala "'+esc(name)+'" (ID: '+esc(e.room)+') - '+esc(priv)+via+'</div>';
      setOccupants(e.occupants||[], e.total);
    } else {
      if(r) r.innerHTML='<div class="empty">Alvo em sala pública — veja a aba Onde.</div>';
      if(o) o.innerHTML='';
    }
    if(tg.avatar){ const av=$('#trackAvatar'); if(av) av.src=tg.avatar; }
  }
  else if(t==='track_occupants'){
    setOccupants(e.occupants||[], e.total);
  }
  else if(t==='track_join'){
    if(lastPrivacy==='PRIVADA'){
      logTrack('<span class="muted">['+nowTime()+']</span> ENTROU NA SALA: '+esc(e.nick||e.cid),'in');
    }
  }
  else if(t==='track_leave'){
    if(lastPrivacy==='PRIVADA'){
      logTrack('<span class="muted">['+nowTime()+']</span> SAIU DA SALA: '+esc(e.nick||e.cid),'out');
    }
  }
  else if(t==='track_left'){
    if(lastPrivacy==='PRIVADA'){
      const r=$('#privRoom');
      if(r) r.innerHTML='<div class="trackline"><span class="muted">['+nowTime()+']</span> SAIU: O alvo saiu da sala de ID '+esc(e.room)+'</div>';
      const o=$('#privOcc'); if(o) o.innerHTML='';
    } else {
      const r=$('#privRoom'); if(r) r.innerHTML='';
    }
  }
  else if(t==='track_stopped'){
    const st=$('#trackStatus'); if(st) st.textContent='rastreio parado';
  }
  else if(t==='track_error'){
    const st=$('#trackStatus'); if(st) st.textContent=e.message||'erro no rastreio';
  }
  else if(t==='update'){
    const d=e.data||{};
    showUpdate(d);
    const o=out('out3');
    if(o){
      if(d.update) o.innerHTML='<div class="tag on">ATUALIZAÇÃO DISPONÍVEL</div><div class="muted" style="margin:8px 0;font-size:13px">versão '+esc(d.versionCode)+'</div><button onclick="Radar.installUpdate(\''+esc(d.url)+'\')">Baixar e instalar</button>';
      else if(d.ok) o.innerHTML='<div class="muted" style="font-size:13px">você já está na última versão</div>';
      else o.innerHTML='<div class="muted" style="font-size:13px">sem novidades: '+esc(d.error||'')+'</div>';
    }
  }
};

function showLogin(msg){
  $('#modal').classList.add('on');
  $('#sheet').innerHTML='<h3 style="margin:0 0 4px">Conectar</h3><div class="muted" style="font-size:13px;margin-bottom:12px">'+esc(msg||'informe a conta e a senha da sua conta IMVU (ficam cifradas no aparelho)')+'</div>'+
   '<input id="u" placeholder="avatar / e-mail" autocapitalize="off" autocorrect="off">'+
   '<input id="p" type="password" placeholder="senha">'+
   '<button onclick="Radar.setCredentials(document.getElementById(\'u\').value.trim(),document.getElementById(\'p\').value);document.getElementById(\'modal\').classList.remove(\'on\')">Conectar</button>';
}


async function api(path, opts){
  opts=opts||{};
  const r=await fetch(path,{cache:'no-store',...opts,headers:{'Content-Type':'application/json'}});
  if(!r.ok) throw new Error('HTTP '+r.status);
  return r.json();
}

function renderRemoteWhere(d){
  const rooms=d.rooms||[];
  const o=out(); if(!o) return;
  let h='<div class="card" style="margin-top:16px"><h1>Salas encontradas</h1><p class="sub">resultado do APK — sem exibir nicks</p></div>';
  if(rooms.length){
    h+='<h2 style="margin-top:16px">Salas</h2>';
    rooms.forEach(function(r){
      h+='<div class="card" style="margin-bottom:12px">';
      h+='<div class="rm">'+esc(r.name||r.roomId)+' <span class="muted mono">['+esc(r.roomId)+']</span></div>';
      h+='<div class="badges" style="margin:8px 0">'+tagRoom(r.privacy)+'<span class="muted">pessoas: '+(r.people||0)+'</span></div>';
      h+='</div>';
    });
  } else {
    h+='<div class="card" style="margin-top:12px"><b>Não achei nas listas públicas</b><p class="sub" style="margin:8px 0 0">Use o APK para a busca completa.</p></div>';
  }
  o.innerHTML=h;
}

async function loadRemoteStatus(){
  if(window.Radar) return;
  try{
    const s=await api('/api/status');
    lastRemoteAt=Date.now();
    lastRemoteImq=!!s.imq;
    const age=(s.updated||0)?Math.max(0,Math.round((Date.now()-s.updated)/1000)):null;
    const stale=!age||age>120;
    const d=$('#dot');
    if(d) d.className=stale?'dot off':(s.imq?'dot':(s.loggedIn?'dot wait':'dot off'));
    if(TAB==='onde'){
      if(s.where && s.where.rooms) renderRemoteWhere(s.where);
    }
    if(TAB==='privada'){
      const priv=s.privacy||'?';
      lastPrivacy=priv;
      const r=$('#privRoom'); const o=$('#privOcc');
      if(s.room && priv==='PRIVADA'){
        const via=s.detectedBy?(' · fonte: '+esc(viaName(s.detectedBy))):'';
        if(r) r.innerHTML='<div class="trackline"><span class="muted">['+nowTime()+']</span> ALVO AQUI: sala "'+esc(s.roomName||s.room)+'" (ID: '+esc(s.room)+') - '+esc(priv)+via+'</div>';
        if(o) o.innerHTML='<span class="muted">['+nowTime()+']</span> OCUPANTES: '+(s.occupants||0);
      } else if(s.room){
        if(r) r.innerHTML='<div class="empty">Alvo em sala pública — veja a aba Onde.</div>';
        if(o) o.innerHTML='';
      } else {
        if(r) r.innerHTML='';
        if(o) o.innerHTML='';
      }
      const st=$('#trackStatus');
      if(st) st.textContent='remoto: IMQ '+(s.imq?'on':'off')+(age!=null?(' · sync '+(age<60?(age+'s'):(Math.round(age/60)+'min'))+' atrás'):' · sem sync');
      const l=$('#trackLog');
      if(l && !l.children.length) l.innerHTML='<div class="empty">log de entradas/saídas no APK; aqui mostra o status atual.</div>';
    }
  }catch(e){
    lastRemoteAt=0;
    const d=$('#dot'); if(d) d.className='dot off';
    const st=$('#trackStatus'); if(st) st.textContent='site/APK offline';
  }
}

render();
setInterval(()=>{
  const d=$('#dot'); if(!d) return;
  if(window.Radar){
    let s=null;
    try{ s=JSON.parse(Radar.status()); }catch(_){ s=null; }
    if(!s) return;
    if(s.loggedIn && s.imq) d.className='dot';
    else if(s.reconnecting || s.loggedIn) d.className='dot wait';
    else d.className='dot off';
  } else {
    const age=lastRemoteAt?(Date.now()-lastRemoteAt):null;
    if(!lastRemoteAt || age>120000) d.className='dot off';
    else d.className=lastRemoteImq?'dot':'dot wait';
  }
}, 4000);
setInterval(()=>{ if(!window.Radar && (TAB==='onde' || TAB==='privada')) loadRemoteStatus(); }, 10000);
</script>
